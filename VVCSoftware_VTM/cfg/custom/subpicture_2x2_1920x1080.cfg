# ============================================================
# 1920x1080, CTU size = 128
# CTU grid = 15 columns x 9 rows
#
#             8 CTUs       7 CTUs
#          +-----------+-----------+
# 5 CTUs   | Subpic 0  | Subpic 1  |
#          +-----------+-----------+
# 4 CTUs   | Subpic 2  | Subpic 3  |
#          +-----------+-----------+
# ============================================================

# Enable picture partitioning
PicPartitionFlag                       : 1

# 2 tile columns: 8 + 7 CTUs
# 2 tile rows:    5 + 4 CTUs
TileColumnWidthArray                    : 8 7
TileRowHeightArray                      : 5 4

# Rectangular slices
RasterScanSlices                        : 0

# Exactly one slice for each subpicture
SingleSlicePerSubpic                    : 1

# Subpicture configuration
SubPicInfoPresentFlag                   : 1
NumSubPics                              : 4

SubPicCtuTopLeftX                       : 0 8 0 8
SubPicCtuTopLeftY                       : 0 0 5 5

SubPicWidth                             : 8 7 8 7
SubPicHeight                            : 5 5 4 4

# Independent prediction boundaries
SubPicTreatedAsPicFlag                  : 1 1 1 1

# No in-loop filtering across subpicture boundaries
LoopFilterAcrossSubpicEnabledFlag       : 0 0 0 0

# Initially use inferred subpicture IDs
SubPicIdMappingExplicitlySignalledFlag  : 0
SubPicIdMappingInSpsFlag                : 0
SubPicIdLen                             : 0
SubPicId                                : 0
